[project]
name = "loremaster"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ania1234", email = "anna.sierhej@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "dotenv>=0.9.9",
    "fastapi[standard]>=0.141.1",
    "litellm>=1.97.0",
    "numpy>=2.5.2",
    "pgvector>=0.5.0",
    "psycopg[binary]>=3.3.4",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "pyjwt[crypto]>=2.13.0",
    "pymupdf>=1.28.2",
    "pymupdf4llm>=1.28.2",
    "pyyaml>=6.0.3",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.0.52",
    "sse-starlette>=3.4.8",
    "supabase>=2.31.0",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
# Not imported by app/ -- matplotlib is only used by experiments/, pytest by
# tests/, and both of those are excluded from the image by .dockerignore.
dev = [
    "matplotlib>=3.11.1",
    "pytest>=9.1.1",
    "pip>=26.2.1",
]

[project.scripts]
loremaster = "app:main"

[tool.uv.build-backend]
module-name = "app"
module-root = ""

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
